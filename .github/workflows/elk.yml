name: ELK Stack Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start ELK
        run: docker compose -f docker-compose-elk.yml up -d

      - name: Check containers
        run: docker compose -f docker-compose-elk.yml ps

      - name: Check Elasticsearch
        run: |
          sleep 60
          curl -f http://localhost:9200
      - name: Send logs
        run: |
          echo "ERROR App crashed" | nc -w 3 localhost 5000

      - name: Check logs
        run: |
          sleep 15
          curl -f "http://localhost:9200/logstash-*/_search?q=error"
